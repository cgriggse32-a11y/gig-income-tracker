<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gig Income Tracker</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --accent:#22c55e; --accent2:#38bdf8; --text:#e8edf3; --muted:#94a3b8; --danger:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .card { background:var(--card); border-radius:12px; padding:12px 14px; }
  .card .label { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .card .value { font-size:1.35rem; font-weight:700; margin-top:2px; }
  .card .value.good { color:var(--accent); }
  .card .value.info { color:var(--accent2); }
  form { background:var(--card); border-radius:12px; padding:14px; margin-bottom:16px; }
  form h2, .section-title { font-size:1rem; margin-bottom:10px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .row.single { grid-template-columns:1fr; }
  label { display:block; font-size:.75rem; color:var(--muted); margin-bottom:4px; }
  input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #2d3a4f; background:#0f1419; color:var(--text); font-size:1rem; }
  input:focus, select:focus { outline:none; border-color:var(--accent2); }
  button { cursor:pointer; border:none; border-radius:8px; font-size:1rem; font-weight:600; padding:12px; }
  .btn-add { background:var(--accent); color:#06240f; width:100%; margin-top:4px; }
  .btn-add:active { transform:scale(.98); }
  .btn-row { display:flex; gap:10px; margin-bottom:16px; }
  .btn-ghost { background:#243044; color:var(--text); flex:1; padding:10px; font-size:.85rem; }
  .shift { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .shift .meta { font-size:.8rem; color:var(--muted); }
  .shift .amt { font-weight:700; color:var(--accent); }
  .shift .del { background:none; color:var(--danger); font-size:1.2rem; padding:4px 8px; }
  .empty { color:var(--muted); text-align:center; padding:20px; font-size:.9rem; }
  .plat-table { width:100%; border-collapse:collapse; font-size:.85rem; margin-bottom:16px; }
  .plat-table th, .plat-table td { padding:8px; text-align:left; border-bottom:1px solid #243044; }
  .plat-table th { color:var(--muted); font-weight:600; font-size:.75rem; text-transform:uppercase; }
  .err { color:var(--danger); font-size:.85rem; margin-top:8px; min-height:1.2em; }
</style>
</head>
<body>
  <h1>🚗 Gig Income Tracker</h1>
  <p class="sub">Log every shift. Know your real $/hour and $/mile.</p>

  <div class="cards">
    <div class="card"><div class="label">Total earned</div><div class="value good" id="stat-earned">$0.00</div></div>
    <div class="card"><div class="label">Net after expenses</div><div class="value good" id="stat-net">$0.00</div></div>
    <div class="card"><div class="label">$ / hour</div><div class="value info" id="stat-perhour">$0.00</div></div>
    <div class="card"><div class="label">$ / mile</div><div class="value info" id="stat-permile">$0.00</div></div>
    <div class="card"><div class="label">Hours worked</div><div class="value" id="stat-hours">0</div></div>
    <div class="card"><div class="label">Miles driven</div><div class="value" id="stat-miles">0</div></div>
  </div>

  <form id="shift-form" autocomplete="off">
    <h2>Log a shift</h2>
    <div class="row">
      <div><label for="f-date">Date</label><input type="date" id="f-date" required></div>
      <div><label for="f-platform">Platform</label>
        <select id="f-platform">
          <option>DoorDash</option><option>Walmart Spark</option><option>Uber Eats</option>
          <option>Amazon Flex</option><option>Roadie</option><option>Instawork</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label for="f-hours">Hours</label><input type="number" id="f-hours" min="0" step="0.25" placeholder="4.5" required></div>
      <div><label for="f-miles">Miles</label><input type="number" id="f-miles" min="0" step="0.1" placeholder="62"></div>
    </div>
    <div class="row">
      <div><label for="f-base">Base pay ($)</label><input type="number" id="f-base" min="0" step="0.01" placeholder="48.00" required></div>
      <div><label for="f-tips">Tips ($)</label><input type="number" id="f-tips" min="0" step="0.01" placeholder="21.50"></div>
    </div>
    <div class="row single">
      <div><label for="f-expenses">Expenses — gas, etc. ($)</label><input type="number" id="f-expenses" min="0" step="0.01" placeholder="12.00"></div>
    </div>
    <button type="submit" class="btn-add">+ Add shift</button>
    <div class="err" id="form-err"></div>
  </form>

  <h2 class="section-title">By platform</h2>
  <div id="plat-wrap"><p class="empty">No shifts yet.</p></div>

  <h2 class="section-title">Shift history</h2>
  <div id="shift-list"><p class="empty">No shifts logged. Add your first one above.</p></div>

  <div class="btn-row">
    <button class="btn-ghost" id="btn-csv">⬇ Export CSV</button>
    <button class="btn-ghost" id="btn-clear">🗑 Clear all</button>
  </div>

<script>
"use strict";
/* ===== Pure logic (testable, no DOM) ===== */
const STORE_KEY = "gigIncomeTracker.v1";

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function validateShift(s) {
  const errs = [];
  if (!s.date) errs.push("Date is required.");
  if (!(Number(s.hours) > 0)) errs.push("Hours must be greater than 0.");
  if (Number(s.base) < 0 || isNaN(Number(s.base))) errs.push("Base pay must be 0 or more.");
  for (const k of ["tips", "miles", "expenses"]) {
    const v = Number(s[k] || 0);
    if (isNaN(v) || v < 0) errs.push(k + " must be 0 or more.");
  }
  return errs;
}

function normalizeShift(s) {
  return {
    id: s.id || newId(),
    date: s.date,
    platform: s.platform || "Other",
    hours: Number(s.hours),
    base: Number(s.base),
    tips: Number(s.tips || 0),
    miles: Number(s.miles || 0),
    expenses: Number(s.expenses || 0)
  };
}

function shiftTotal(s) { return s.base + s.tips; }

function calcStats(shifts) {
  let earned = 0, hours = 0, miles = 0, expenses = 0;
  const byPlat = {};
  for (const s of shifts) {
    const t = shiftTotal(s);
    earned += t; hours += s.hours; miles += s.miles; expenses += s.expenses;
    const p = byPlat[s.platform] || (byPlat[s.platform] = { earned: 0, hours: 0, shifts: 0 });
    p.earned += t; p.hours += s.hours; p.shifts += 1;
  }
  return {
    earned, hours, miles, expenses,
    net: earned - expenses,
    perHour: hours > 0 ? earned / hours : 0,
    netPerHour: hours > 0 ? (earned - expenses) / hours : 0,
    perMile: miles > 0 ? earned / miles : 0,
    byPlat
  };
}

function toCSV(shifts) {
  const head = "date,platform,hours,base_pay,tips,total,miles,expenses";
  const rows = shifts.map(s => [s.date, s.platform, s.hours, s.base.toFixed(2), s.tips.toFixed(2),
    shiftTotal(s).toFixed(2), s.miles, s.expenses.toFixed(2)].join(","));
  return head + "\n" + rows.join("\n");
}

/* ===== Storage ===== */
function loadShifts() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.map(normalizeShift) : [];
  } catch (e) { return []; }
}
function saveShifts(shifts) { localStorage.setItem(STORE_KEY, JSON.stringify(shifts)); }

/* ===== UI ===== */
const $ = id => document.getElementById(id);
let shifts = loadShifts();

function money(n) { return "$" + Number(n).toFixed(2); }

function render() {
  const st = calcStats(shifts);
  $("stat-earned").textContent = money(st.earned);
  $("stat-net").textContent = money(st.net);
  $("stat-perhour").textContent = money(st.perHour);
  $("stat-permile").textContent = money(st.perMile);
  $("stat-hours").textContent = st.hours.toFixed(1);
  $("stat-miles").textContent = Math.round(st.miles);

  const plats = Object.entries(st.byPlat).sort((a, b) => b[1].earned - a[1].earned);
  $("plat-wrap").innerHTML = plats.length ? (
    '<table class="plat-table"><tr><th>Platform</th><th>Shifts</th><th>Earned</th><th>$/hr</th></tr>' +
    plats.map(([name, p]) =>
      `<tr><td>${esc(name)}</td><td>${p.shifts}</td><td>${money(p.earned)}</td>` +
      `<td>${p.hours > 0 ? money(p.earned / p.hours) : "—"}</td></tr>`).join("") + "</table>"
  ) : '<p class="empty">No shifts yet.</p>';

  const sorted = [...shifts].sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1));
  $("shift-list").innerHTML = sorted.length ? sorted.map(s =>
    `<div class="shift"><div><div><strong>${esc(s.platform)}</strong> · ${esc(s.date)}</div>` +
    `<div class="meta">${s.hours}h · ${s.miles} mi · expenses ${money(s.expenses)}</div></div>` +
    `<div style="display:flex;align-items:center;gap:4px"><span class="amt">${money(shiftTotal(s))}</span>` +
    `<button class="del" data-id="${s.id}" aria-label="Delete">×</button></div></div>`
  ).join("") : '<p class="empty">No shifts logged. Add your first one above.</p>';

  document.querySelectorAll(".del").forEach(b =>
    b.addEventListener("click", () => {
      shifts = shifts.filter(s => s.id !== b.dataset.id);
      saveShifts(shifts); render();
    }));
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

$("shift-form").addEventListener("submit", e => {
  e.preventDefault();
  const raw = {
    date: $("f-date").value,
    platform: $("f-platform").value,
    hours: $("f-hours").value, base: $("f-base").value,
    tips: $("f-tips").value, miles: $("f-miles").value, expenses: $("f-expenses").value
  };
  const errs = validateShift(raw);
  if (errs.length) { $("form-err").textContent = errs[0]; return; }
  $("form-err").textContent = "";
  shifts.push(normalizeShift(raw));
  saveShifts(shifts); render();
  $("f-hours").value = ""; $("f-base").value = ""; $("f-tips").value = "";
  $("f-miles").value = ""; $("f-expenses").value = "";
});

$("btn-csv").addEventListener("click", () => {
  if (!shifts.length) return;
  const blob = new Blob([toCSV(shifts)], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gig-income.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

$("btn-clear").addEventListener("click", () => {
  if (shifts.length && confirm("Delete ALL logged shifts? This can't be undone.")) {
    shifts = []; saveShifts(shifts); render();
  }
});

$("f-date").value = new Date().toISOString().slice(0, 10);
render();

/* node-test hook: allows `node` to exercise pure logic */
if (typeof module !== "undefined") module.exports = { validateShift, normalizeShift, shiftTotal, calcStats, toCSV, STORE_KEY };
</script>
</body>
</html>
